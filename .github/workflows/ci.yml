name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:privacy
      - run: npm run build
      - name: Verify committed generated assets
        run: git diff --exit-code -- tokens/dist icons/dist components patterns principles templates SKILL.md styles.css scripts/audit.js
      - run: npm run check
      - run: npm run typecheck
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm test
      - run: npm run build:showcase
