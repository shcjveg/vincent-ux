name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:privacy
      - run: npm run build
      - run: npm run icons -- node_modules
      - name: Verify committed generated assets
        run: git diff --exit-code -- tokens/dist icons/dist components patterns principles templates SKILL.md styles.css scripts/audit.js
      - run: npm run check
      - run: npm run typecheck
      - run: npx playwright install --with-deps chrome
      - run: npm test
      - run: npm run build:showcase
